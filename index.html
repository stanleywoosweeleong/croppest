<style>
/* Phone-first app shell: frosted top bar, one view per route, bottom tab bar.
   Interface text comes from i18n.js, pest content from data.js. */
:root{
  --bg:#f2eee5; --surface:#fbf8f1; --ink:#2b2822; --muted:#615b50; --line:#ddd5c6;
  --accent:#2a7149; --accent-soft:#dcefe2; --bad:#a3392f; --bad-soft:#f6dfdb;
  --warn:#8a5e08; --warn-soft:#f6ead0; --bar:#24432f; --bar-ink:#eef5ef;
  --c-insect:#94590a; --c-insect-soft:#f6e6c9; --c-fungus:#7a4a8c; --c-fungus-soft:#efe2f3; --c-bact:#2f6596; --c-bact-soft:#dde9f4;
  --c-virus:#a3392f; --c-virus-soft:#f6dfdb; --c-nema:#6b5a3a; --c-nema-soft:#ece4d4; --c-alga:#2f7a70; --c-alga-soft:#d8eeea;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar:64px; --topbar:56px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a15; --surface:#1a241e; --ink:#dcd6c8; --muted:#a29c8f; --line:#2e3c34;
  --accent:#72c693; --accent-soft:#1f3628; --bad:#ef8f84; --bad-soft:#3d2320;
  --warn:#e2b14e; --warn-soft:#3a2f17; --bar:#2f5a3e; --bar-ink:#eef5ef;
  --c-insect:#e2b14e; --c-insect-soft:#3a2f17; --c-fungus:#cfa1e0; --c-fungus-soft:#33263a; --c-bact:#8fbce6; --c-bact-soft:#1e2d3b;
  --c-virus:#ef8f84; --c-virus-soft:#3d2320; --c-nema:#cdb88e; --c-nema-soft:#352d20; --c-alga:#7fd0c3; --c-alga-soft:#1b3330;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a15; --surface:#1a241e; --ink:#dcd6c8; --muted:#a29c8f; --line:#2e3c34;
  --accent:#72c693; --accent-soft:#1f3628; --bad:#ef8f84; --bad-soft:#3d2320;
  --warn:#e2b14e; --warn-soft:#3a2f17; --bar:#2f5a3e; --bar-ink:#eef5ef;
  --c-insect:#e2b14e; --c-insect-soft:#3a2f17; --c-fungus:#cfa1e0; --c-fungus-soft:#33263a; --c-bact:#8fbce6; --c-bact-soft:#1e2d3b;
  --c-virus:#ef8f84; --c-virus-soft:#3d2320; --c-nema:#cdb88e; --c-nema-soft:#352d20; --c-alga:#7fd0c3; --c-alga-soft:#1b3330;
  color-scheme:dark}
:lang(zh){--f-display:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
:lang(zh) body{font-size:1.1rem;font-weight:500;line-height:1.7}
:lang(zh) h1,:lang(zh) h2,:lang(zh) h3{font-weight:700}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.03rem;line-height:1.55;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;min-height:100vh}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

.top{position:fixed;inset:0 0 auto;z-index:20;
  background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(20px);backdrop-filter:saturate(1.4) blur(20px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{height:var(--topbar);display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.top h1{font-size:1.25rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offline-tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer;white-space:nowrap;font-weight:700}
.langbtn{width:auto;min-width:36px;padding:0 10px;font-weight:700;font-size:.85rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg,.tabs svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn svg{width:18px;height:18px}

main{padding-top:calc(var(--topbar) + env(safe-area-inset-top,0px));
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:760px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:16px}
.view > h2{font-size:1.6rem}
.lede{color:var(--muted)}
.eyebrow{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.backbtn{align-self:flex-start;border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;display:inline-flex;gap:4px;align-items:center}

/* Crop grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.crop{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crop .ph{display:block;aspect-ratio:4/3;background:#fff}
.crop .ph img{width:100%;height:100%;object-fit:cover;display:block}
.crop .t{flex:1}
.noph{display:grid;place-items:center;width:100%;height:100%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-size:3rem}
.crop .t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.crop .t b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.crop .t small{color:var(--muted);font-size:.85rem}
:lang(zh) .crop .t b{font-weight:700}

/* Pest list rows */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) 12px;gap:12px;align-items:center;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.row img,.row .noimg{width:76px;height:76px;object-fit:cover;border-radius:8px;display:block;background:#fff}
.row .noimg{display:grid;place-items:center;background:var(--kc-soft);color:var(--kc);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:4px}
.row .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t b{font-weight:700;line-height:1.3}
.sci{color:var(--muted);font-size:.9rem;display:block}
.row .t small{color:var(--muted);font-size:.82rem}
.row .chev{color:var(--muted)}

/* Pest detail */
.hero{display:flex;justify-content:center;cursor:zoom-in}
.hero img{display:block;max-width:100%;max-height:440px;width:auto;height:auto;border-radius:12px;background:#fff}
.title{display:flex;flex-direction:column;gap:4px}
.title h2{font-size:1.5rem}
.title .alt{color:var(--muted);font-size:.95rem}
.sci.inl{display:inline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;text-decoration:none;color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:1.2rem}
.rich > * + *{margin-top:10px}
.rich ul,.rich ol{margin:0;padding-left:1.25em}
.rich li + li{margin-top:6px}
.sym{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.sym:first-of-type{border-top:0;padding-top:0}
.sym .part{font-weight:700;color:var(--accent)}
.sym .hero img{max-height:420px}
details.steps{background:var(--bg);border-radius:10px;padding:10px 12px}
details.steps summary{cursor:pointer;font-weight:700;color:var(--accent)}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;margin-top:10px;align-items:start}
.step img{width:96px;height:96px;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--line)}
.step .n{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.step.noimg{grid-template-columns:1fr}
.src{font-size:.9rem;color:var(--muted)}
.note{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}

/* Diagnose */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700;text-decoration:none;color:inherit}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.match{display:flex;flex-direction:column;gap:10px}
.match img{display:block;margin:0 auto;max-width:100%;width:auto;max-height:360px;border-radius:10px;background:#fff}
.match .name{font-weight:700;font-size:1.05rem}

/* Search */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
mark{background:var(--warn-soft);color:inherit;border-radius:3px}

/* Learn */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg.three{grid-template-columns:repeat(3,1fr)} .seg.four{grid-template-columns:repeat(4,1fr)}
.seg button{border:0;border-radius:9px;padding:10px 6px;background:transparent;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.qimg{display:block;margin:0 auto;max-width:100%;width:auto;max-height:380px;border-radius:12px;background:#fff;cursor:zoom-in}
.qpart{color:var(--muted);font-size:.9rem}
.answers{display:flex;flex-direction:column;gap:8px}
.answers button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700}
.answers button.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.answers button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.answers button:disabled{cursor:default}
.answers button .sci{font-weight:400;font-size:.88rem}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.flash .qimg{border-radius:0;margin-top:0}
.flash .a{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.primary{border:0;background:var(--bar);color:var(--bar-ink);border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;font-size:1rem;text-align:center;text-decoration:none}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Kind tags, guide, progress */
.kind{display:inline-block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;border-radius:999px;padding:1px 8px;align-self:flex-start;background:var(--kc-soft);color:var(--kc)}
.k-insect{--kc:var(--c-insect);--kc-soft:var(--c-insect-soft)} .k-fungus{--kc:var(--c-fungus);--kc-soft:var(--c-fungus-soft)}
.k-bacteria{--kc:var(--c-bact);--kc-soft:var(--c-bact-soft)} .k-virus{--kc:var(--c-virus);--kc-soft:var(--c-virus-soft)}
.k-nematode{--kc:var(--c-nema);--kc-soft:var(--c-nema-soft)} .k-alga{--kc:var(--c-alga);--kc-soft:var(--c-alga-soft)}
.k-mammal{--kc:var(--muted);--kc-soft:var(--line)}
.kindcard{border-left:4px solid var(--kc)}
.kindcard summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
.kindcard summary::-webkit-details-marker{display:none}
.kindcard summary b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;color:var(--kc)}
:lang(zh) .kindcard summary b{font-weight:700}
.kindcard summary small{color:var(--muted);font-size:.85rem}
.kindcard[open] summary{margin-bottom:4px}
.kv{display:grid;gap:4px 0}
.kv b{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.gloss{margin:0;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.gloss > div{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.gloss dt{font-weight:700;display:flex;flex-direction:column}
.gloss dt small{font-weight:400;color:var(--muted);font-size:.85rem}
.gloss dd{margin:0}
.guidelink{display:grid;grid-template-columns:minmax(0,1fr) 12px;gap:2px 10px;align-items:center;text-decoration:none;color:inherit;background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.guidelink b{color:var(--accent)} .guidelink span:not(.chev){grid-column:1;color:var(--muted);font-size:.9rem} .guidelink .chev{grid-row:1/3;grid-column:2;color:var(--accent)}
.mbar{display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.mbar span{display:block;height:100%;background:var(--accent)}
.opts.small .opt{padding:6px 12px;font-size:.9rem}
.opt small{color:var(--muted);font-weight:400}
.prog{display:flex;flex-direction:column;gap:6px}
.progress.thin{height:4px}
.feedback{gap:8px}
.feedback.good{border-color:var(--accent);background:var(--accent-soft)}
.feedback.badc{border-color:var(--bad);background:var(--bad-soft)}
.small{font-size:.9rem}

.syms{display:flex;flex-direction:column;gap:22px}
.syms > h3{font-size:1.2rem;margin-bottom:-10px}
.sym .hero{margin-bottom:2px}
.sym .part{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.title .chips{margin-top:6px}
a.kind{text-decoration:none}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mini{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;background:var(--surface)}
.mini img,.mini > span:first-child{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#fff;display:block}
.mini b{display:block;font-size:.95rem;line-height:1.25}
.mini small{color:var(--muted);font-size:.8rem}
.picked{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-weight:700}
.picked span{font-family:var(--f-display);font-weight:400;font-size:1.2rem;color:var(--accent)}
a.match{text-decoration:none;color:inherit}
.mtitle{display:grid;grid-template-columns:minmax(0,1fr) 12px;gap:2px 8px;align-items:center}
.mtitle .kind{grid-column:1;justify-self:start}
.mtitle .name{grid-column:1;font-weight:700;font-size:1.1rem}
.mtitle .chev{grid-column:2;grid-row:1/3;color:var(--muted)}
.sel{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sel select{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;min-width:0;max-width:60%}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;gap:10px}

.ctl{border-color:var(--accent);gap:8px}
.ctl .bar h3{font-size:1.15rem}
.chip.ai{font-weight:700;color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.muted{color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0}
.gloss .hl{background:var(--accent-soft);border-radius:8px;padding-left:10px;padding-right:10px}
.gloss .chips small{color:var(--muted);font-size:.78rem}
#ctl,#ai,[id^="ai-"],[id^="kind-"]{scroll-margin-top:calc(var(--topbar) + env(safe-area-inset-top,0px) + 12px)}

/* Tabs */
.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{height:var(--tabbar);display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:700}
.tabs svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--accent)}

/* Sheets, viewer, onboarding */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{font-size:1.3rem}
.xbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--line);font-size:1.4rem;line-height:1;cursor:pointer}
.blk{display:flex;flex-direction:column;gap:8px}
.blk > b{font-size:.95rem}
.blk p{color:var(--muted);font-size:.93rem}
.ver{text-align:center;color:var(--muted);font-size:.85rem}
html:has(.scrim:not([hidden])),html:has(.viewer:not([hidden])),html:has(.onboard:not([hidden])){overflow:hidden}
.viewer{position:fixed;inset:0;z-index:70;background:rgb(10 14 11 / .95);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer .vb{display:flex;justify-content:flex-end;padding:8px}
.viewer .vx{width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255 / .16);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer}
.viewer .vs{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
.viewer .vs img{max-width:100%;max-height:100%;border-radius:8px;cursor:zoom-in}
.viewer .vs.zoomed{align-items:flex-start;justify-content:flex-start}
.viewer .vs.zoomed img{max-width:none;max-height:none;width:250%;flex:none;cursor:zoom-out}
.viewer .vc{color:#e8eee9;font-size:.9rem;padding:8px 16px 12px;text-align:center}
.onboard{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ob-in{max-width:420px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ob-top{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ob-top img{width:64px;height:64px;border-radius:14px}
.ob-top b{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.ob-top span{color:var(--muted);font-size:.9rem}
.ob-pick{text-align:center;margin-top:auto;display:flex;flex-direction:column;gap:4px}
.ob-pick h2{font-size:1.35rem;line-height:1.35}
.ob-pick h2 + h2{font-size:1.05rem;color:var(--muted)}
.langs{display:flex;flex-direction:column;gap:10px;margin-bottom:auto}
.langs button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;cursor:pointer;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:15px 16px;font-size:1.1rem;font-weight:700}
.langs button span{font-weight:400;color:var(--muted);font-size:.85rem}
.langs button[aria-pressed="true"]{border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1 id="appName"></h1>
    <span class="offline-tag" id="offline" hidden></span>
    <button class="iconbtn langbtn" id="langBtn" type="button" aria-label="Language"></button>
    <button class="iconbtn" id="setBtn" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9"/><circle cx="12" cy="12" r="6.6"/></svg></button>
  </div>
</header>

<main><section class="view" id="view" tabindex="-1"></section></main>

<nav class="tabs">
  <div class="tabs-in">
    <a href="#crops" data-tab="crops"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11"/><path d="M12 11c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 14c0-3-2.5-5.5-7-5.5 0 4 2.5 6.5 7 5.5z"/></svg><span data-t="tabCrops"></span></a>
    <a href="#diag" data-tab="diag"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/><path d="M8 10.5h5M10.5 8v5"/></svg><span data-t="tabDiag"></span></a>
    <a href="#learn" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/><path d="M7 11l2 2 4-4"/></svg><span data-t="tabLearn"></span></a>
    <a href="#search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg><span data-t="tabSearch"></span></a>
  </div>
</nav>

<div class="scrim" id="setSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-head"><h2 id="setTitle" tabindex="-1" data-t="settings"></h2><button class="xbtn" type="button" data-close aria-label="Close">×</button></div>
    <div class="blk"><b data-t="theme"></b><div class="seg three" id="setTheme"><button type="button" data-v="system" data-t="themeSys"></button><button type="button" data-v="light" data-t="themeLight"></button><button type="button" data-v="dark" data-t="themeDark"></button></div></div>
    <div class="blk"><b data-t="textSize"></b><div class="seg four" id="setSize"><button type="button" data-v="0" style="font-size:.85rem">A</button><button type="button" data-v="1">A</button><button type="button" data-v="2" style="font-size:1.15rem">A</button><button type="button" data-v="3" style="font-size:1.3rem">A</button></div></div>
    <div class="blk"><b data-t="offlineTitle"></b><p data-t="offlineLede"></p><button class="ghost" type="button" id="dlBtn" data-t="offlineBtn"></button><p id="dlMsg" hidden></p></div>
    <div class="blk"><b data-t="progress"></b><p data-t="masteredHint"></p><button class="ghost" type="button" id="resetBtn" data-t="resetProgress"></button></div>
    <div class="blk"><b data-t="aboutTitle"></b><p data-t="aboutBody"></p><p data-t="aboutDisclaimer"></p><a href="https://smarttani.sabah.gov.my/ALUS/Pest/" target="_blank" rel="noopener" data-t="aboutLink"></a></div>
    <p class="ver" id="ver"></p>
  </div>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true">
  <div class="vb"><button class="vx" type="button" data-close aria-label="Close">×</button></div>
  <div class="vs" id="vStage"><img alt=""></div>
  <div class="vc" id="vCap"></div>
</div>

<div class="onboard" id="onboard" hidden>
  <div class="ob-in">
    <div class="ob-top"><img src="icons/icon-192.png" alt=""><b>Perosak Tanaman</b><span>Sabah</span></div>
    <div class="ob-pick"><h2 lang="ms">Pilih bahasa</h2><h2 lang="en">Choose your language</h2><h2 lang="zh">选择语言</h2></div>
    <div class="langs">
      <button type="button" data-lang="ms" lang="ms">Bahasa Melayu <span>BM</span></button>
      <button type="button" data-lang="en" lang="en">English <span>EN</span></button>
      <button type="button" data-lang="zh" lang="zh">中文 <span>中</span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="guide.js"></script>
<script>
const VERSION = '2.1.0';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('cp.' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('cp.' + k, JSON.stringify(v)) } catch {} }
};
const guessLang = () => { const n = (navigator.language || 'ms').toLowerCase(); return n.startsWith('zh') ? 'zh' : n.startsWith('en') ? 'en' : 'ms' };
let lang = store.get('lang', null) || guessLang();
const t = (k, ...a) => { const v = UI[lang][k]; return typeof v === 'function' ? v(...a) : v };
const L = o => o ? (o[lang] || o.ms || o.en || '') : '';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim() };

const PESTS = new Map(DATA.pests.map(p => [p.id, p]));
const CROPS = new Map(DATA.crops.map(c => [c.code, c]));
const PART_ORDER = ['LEAF', 'STEM', 'FR', 'FLOWER', 'ROOT', 'PLANT', 'PEST', 'MORFOLOGI'];
const thumb = f => f ? 'img/t/' + f : '';
const full = f => f ? 'img/' + f : '';
const firstImg = p => { for (const s of p.symptoms) { if (s.img) return s.img; for (const st of s.steps) if (st.img) return st.img } return null };
const sourceUrl = p => 'https://smarttani.sabah.gov.my/ALUS/Pest/library/pest/detail/' + p.id + '/view/';
const img = (f, cls = '', alt = '') => f ? `<img src="${thumb(f)}" data-full="${full(f)}" class="${cls}" alt="${esc(alt)}" loading="lazy" decoding="async">` : '';
const bigImg = (f, cls = '', alt = '') => f ? `<img src="${full(f)}" data-full="${full(f)}" class="${cls}" alt="${esc(alt)}" loading="lazy" decoding="async">` : '';

/* ---------- Views ---------- */
const kindTag = p => p.kind ? `<span class="kind k-${KINDS[p.kind].color}">${esc(t('kind_' + p.kind))}</span>` : '';
function pestRow(p, extra = '') {
  const f = firstImg(p);
  return `<a class="row" href="#pest/${p.id}">${f ? img(f, '', '') : `<span class="noimg k-${p.kind ? KINDS[p.kind].color : 'mammal'}">${esc(t('kind_' + p.kind) || '')}</span>`}
    <span class="t">${kindTag(p)}<b>${esc(L(p.name))}</b><span class="sci">${p.sci}</span>${extra}</span><span class="chev">›</span></a>`;
}
const cropCard = c => `<a class="crop" href="#crop/${c.code}"><span class="ph">${c.img ? `<img src="${thumb(c.img)}" alt="" loading="lazy">` : `<span class="noph">${esc([...L(c.name)][0] || '')}</span>`}</span>
    <span class="t"><b>${esc(L(c.name))}</b><small>${esc(t('nPests', c.pests.length))}</small>${masteryBar(c)}</span></a>`;
const isWeeds = c => c.code === 'WEED' || c.code === 'WEEDS';
function vCrops() {
  const crops = DATA.crops.filter(c => !isWeeds(c)).sort((a, b) => b.pests.length - a.pests.length || L(a.name).localeCompare(L(b.name), lang));
  const weeds = DATA.crops.filter(isWeeds);
  return `<h2>${esc(t('cropsTitle'))}</h2>
  <div class="grid">${crops.map(cropCard).join('')}</div>
  ${weeds.length ? `<h3>${esc(t('weedsTitle'))}</h3><div class="grid">${weeds.map(cropCard).join('')}</div>` : ''}
  <a class="guidelink" href="#guide"><b>${esc(t('openGuide'))}</b><span>${esc(t('guideKinds'))} · ${esc(t('aiIndex'))} · ${esc(t('glossary'))}</span><span class="chev">›</span></a>`;
}
let kindFilter = 'ALL';
function vCrop(code) {
  const c = CROPS.get(code); if (!c) return vCrops();
  const all = c.pests.map(id => PESTS.get(id)).filter(Boolean).sort((a, b) => L(a.name).localeCompare(L(b.name), lang));
  const kinds = [...new Set(all.map(p => p.kind))];
  if (kindFilter !== 'ALL' && !kinds.includes(kindFilter)) kindFilter = 'ALL';
  const ps = all.filter(p => kindFilter === 'ALL' || p.kind === kindFilter);
  return `<button class="backbtn" type="button" data-back>‹ ${esc(t('back'))}</button>
  <h2>${esc(L(c.name))}</h2><p class="lede">${esc(t('nPests', all.length))}</p>
  ${kinds.length > 1 ? `<div class="opts small" id="kFilter"><button class="opt" type="button" data-v="ALL" aria-pressed="${kindFilter === 'ALL'}">${esc(t('allKinds'))}</button>${kinds.map(k => `<button class="opt" type="button" data-v="${k}" aria-pressed="${kindFilter === k}">${esc(t('kind_' + k))} <small>${all.filter(p => p.kind === k).length}</small></button>`).join('')}</div>` : ''}
  <div class="list">${ps.map(p => pestRow(p)).join('')}</div>`;
}
/* Other pests on the same crop that show symptoms on the same plant part */
function lookalikes(p) {
  const parts = new Set(p.symptoms.map(s => s.part).filter(x => !['PEST', 'MORFOLOGI', 'LC'].includes(x)));
  const out = [];
  DATA.pests.forEach(o => {
    if (o === p || !o.crops.some(c => p.crops.includes(c))) return;
    const shared = o.symptoms.filter(s => parts.has(s.part)).map(s => s.part);
    if (shared.length) out.push([o, [...new Set(shared)]]);
  });
  return out;
}
/* Word overlap, to drop confirmation steps that only repeat the symptom text */
const words = h => new Set(plain(h).toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 2));
const overlap = (a, b) => { const A = words(a), B = words(b); if (!A.size) return 1; let n = 0; A.forEach(w => B.has(w) && n++); return n / A.size };
const kindLink = p => p.kind ? `<a class="kind k-${KINDS[p.kind].color}" href="#guide/${p.kind}">${esc(t('kind_' + p.kind))}</a>` : '';
/* Control at a glance: the active ingredients the source names, or why there are none */
function ctlBox(p) {
  const noCure = ['bacteria', 'virus', 'nematode'].includes(p.kind);
  return `<div class="card ctl"><div class="bar"><h3>${esc(t('ctlTitle'))}</h3>${L(p.desc) ? `<button class="linkbtn" type="button" data-jump="ctl">${esc(t('ctlMore'))} ↓</button>` : ''}</div>
    ${p.ai.length ? `<span class="eyebrow">${esc(t('ctlAI'))}</span><div class="chips">${p.ai.map(a => `<a class="chip ai" href="#guide/ai/${encodeURIComponent(a)}">${esc(a)}</a>`).join('')}</div><p class="small muted">${esc(t('ctlCheck'))}</p>`
      : `<p>${esc(t('ctlNone'))}${noCure ? ` <a href="#guide/${p.kind}">${esc(t('ctlNoCure'))} ›</a>` : ''}</p>`}</div>`;
}
function vPest(id) {
  const p = PESTS.get(+id); if (!p) return vCrops();
  const syms = p.symptoms.slice().sort((a, b) => PART_ORDER.indexOf(a.part) - PART_ORDER.indexOf(b.part));
  const look = lookalikes(p);
  // keep only what a step adds: a new photo, or text that is not a rewording of the symptom
  const steps = s => s.steps.map(st => ({ img: st.img && st.img !== s.img ? st.img : null, text: L(st.text) && overlap(L(st.text), L(s.text)) < .6 ? L(st.text) : '' }))
    .filter(st => st.img || st.text);
  return `<div class="bar"><button class="backbtn" type="button" data-back>‹ ${esc(t('back'))}</button><button class="pill" type="button" id="shareBtn">${esc(t('share'))}</button></div>
  <div class="title">${kindLink(p)}<h2>${esc(L(p.name))}</h2><p class="alt sci">${p.sci}</p>
    <div class="chips">${p.crops.map(c => `<a class="chip" href="#crop/${c}">${esc(L(CROPS.get(c).name))}</a>`).join('')}</div></div>
  ${ctlBox(p)}
  ${syms.length ? `<section class="syms"><h3>${esc(t('symptoms'))}</h3>${syms.map(s => { const st = steps(s); return `<div class="sym">
    ${s.img ? `<div class="hero">${bigImg(s.img, '', L(p.name) + ' · ' + L(DATA.parts[s.part]))}</div>` : ''}
    <span class="part">${esc(L(DATA.parts[s.part]))}</span>
    <div class="rich">${L(s.text)}</div>
    ${st.length ? `<details class="steps"><summary>${esc(t('steps'))}</summary>${st.map((x, i) => `<div class="step${x.img ? '' : ' noimg'}">${img(x.img)}<div>${st.length > 1 ? `<div class="n">${esc(t('stepN', i + 1))}</div>` : ''}<div class="rich">${x.text}</div></div></div>`).join('')}</details>` : ''}
  </div>` }).join('')}</section>` : ''}
  ${L(p.desc) ? `<div class="card" id="ctl"><h3>${esc(t('aboutCtl'))}</h3><div class="rich">${L(p.desc)}</div></div>` : ''}
  ${look.length ? `<div class="blk"><h3>${esc(t('lookalike'))}</h3><p class="lede small">${esc(t('lookalikeLede'))}</p>
    <div class="minis">${look.map(([o, parts]) => `<a class="mini" href="#pest/${o.id}">${firstImg(o) ? `<img src="${thumb(firstImg(o))}" alt="" loading="lazy">` : '<span></span>'}<span><b>${esc(L(o.name))}</b><small>${esc(t('kind_' + o.kind))} · ${parts.map(x => esc(L(DATA.parts[x]))).join(', ')}</small></span></a>`).join('')}</div></div>` : ''}
  <p class="src">${esc(t('source'))}: <a href="${sourceUrl(p)}" target="_blank" rel="noopener">smarttani.sabah.gov.my</a></p>`;
}

/* Guide: kinds of cause, then glossary */
let aiOpen = null;
function vGuide(open) {
  const count = k => DATA.pests.filter(p => p.kind === k).length;
  return `<button class="backbtn" type="button" data-back>‹ ${esc(t('back'))}</button>
  <h2>${esc(t('guideKinds'))}</h2><p class="lede">${esc(t('guideKindsLede'))}</p>
  ${Object.entries(KINDS).map(([k, K]) => `<details class="card kindcard k-${K.color}" id="kind-${k}"${k === open ? ' open' : ''}><summary><b>${esc(L(K.name))}</b><small>${esc(t('nPests', count(k)))}</small></summary>
    <div class="kv"><b>${esc(t('kindWhat'))}</b><p>${esc(L(K.what))}</p><b>${esc(t('kindSign'))}</b><p>${esc(L(K.sign))}</p><b>${esc(t('kindControl'))}</b><p>${esc(L(K.control))}</p></div>
    <div class="chips">${DATA.pests.filter(p => p.kind === k).map(p => `<a class="chip" href="#pest/${p.id}">${esc(L(p.name))}</a>`).join('')}</div></details>`).join('')}
  <h2 id="ai">${esc(t('aiIndex'))}</h2><p class="lede">${esc(t('aiIndexLede'))}</p>
  <dl class="gloss">${[...new Set(DATA.pests.flatMap(p => p.ai))].sort().map(a => `<div id="ai-${esc(a.replace(/\W+/g, '-'))}"${decodeURIComponent(aiOpen || '') === a ? ' class="hl"' : ''}><dt>${esc(a)}</dt><dd><div class="chips">${DATA.pests.filter(p => p.ai.includes(a)).map(p => `<a class="chip" href="#pest/${p.id}">${esc(L(p.name))} <small>${p.crops.map(c => esc(L(CROPS.get(c).name))).join(', ')}</small></a>`).join('')}</div></dd></div>`).join('')}</dl>
  <h2 id="glossary">${esc(t('glossary'))}</h2><p class="lede">${esc(t('glossaryLede'))}</p>
  <dl class="gloss">${GLOSSARY.map(g => `<div><dt>${esc(L(g.t))}</dt><dd>${esc(L(g.d))}</dd></div>`).join('')}</dl>`;
}

/* Diagnose: crop -> part -> matching symptoms */
function partsFor(code) {
  const set = new Set();
  CROPS.get(code).pests.forEach(id => (PESTS.get(id)?.symptoms || []).forEach(s => set.add(s.part)));
  return PART_ORDER.filter(p => set.has(p)).concat([...set].filter(p => !PART_ORDER.includes(p)));
}
function vDiag(code, part) {
  const c = code && CROPS.get(code);
  let h = `<h2>${esc(t('diagTitle'))}</h2><p class="lede">${esc(t('diagLede'))}</p>`;
  if (!c) return h + `<b>${esc(t('diagCrop'))}</b><div class="grid">${DATA.crops.map(x => `<a class="crop" href="#diag/${x.code}"><span class="ph">${x.img ? `<img src="${thumb(x.img)}" alt="" loading="lazy">` : ''}</span><span class="t"><b>${esc(L(x.name))}</b></span></a>`).join('')}</div>`;
  h += `<div class="picked"><span>${esc(L(c.name))}</span><a href="#diag">${esc(t('change'))}</a></div>
  <div class="blk"><b>${esc(t('diagPart'))}</b><div class="opts">${partsFor(code).map(p => `<a class="opt" href="#diag/${code}/${p}" aria-pressed="${p === part}">${esc(L(DATA.parts[p]))}</a>`).join('')}</div></div>`;
  if (part) {
    const hits = [];
    c.pests.forEach(id => { const p = PESTS.get(id); p && p.symptoms.filter(s => s.part === part).forEach(s => hits.push([p, s])) });
    h += `<p class="eyebrow" id="diagRes">${esc(t('diagMatch', hits.length))}</p>
    ${hits.map(([p, s]) => `<a class="card match" href="#pest/${p.id}">${s.img ? `<img src="${full(s.img)}" alt="" loading="lazy">` : ''}
      <div class="mtitle">${kindTag(p)}<span class="name">${esc(L(p.name))}</span><span class="chev">›</span></div>
      <div class="rich">${L(s.text)}</div></a>`).join('')}
    <p class="note">${esc(t('diagNote'))}</p>`;
  }
  return h;
}

/* Search across all three languages */
let q = '';
function searchHits(s) {
  s = s.trim().toLowerCase(); if (s.length < 2) return null;
  return DATA.pests.filter(p => (p._idx ||= [p.name.ms, p.name.en, p.name.zh, plain(p.sci),
    ...p.crops.flatMap(c => Object.values(CROPS.get(c).name)),
    ...['ms', 'en', 'zh'].flatMap(l => [plain(p.desc[l] || ''), ...p.symptoms.map(x => plain(x.text[l] || ''))])].join(' ').toLowerCase()).includes(s));
}
function vSearch() {
  return `<h2>${esc(t('tabSearch'))}</h2><input class="search" id="q" type="search" autocomplete="off" placeholder="${esc(t('searchPh'))}" value="${esc(q)}"><div class="list" id="qres"></div>`;
}
function renderSearch() {
  const hits = searchHits(q), el = $('#qres'); if (!el) return;
  el.innerHTML = hits == null ? `<p class="lede">${esc(t('searchHint'))}</p>` : hits.length ? hits.map(p => pestRow(p, `<small>${p.crops.map(c => esc(L(CROPS.get(c).name))).join(' · ')}</small>`)).join('') : `<p class="lede">${esc(t('searchNone'))}</p>`;
}

/* Learn: photo quiz (name or type) and flashcards, built from every symptom photo.
   Progress per pest is kept on this phone; weak and unseen pests come up more often. */
let stats = store.get('stats', {});
const isMastered = id => { const s = stats[id]; return !!s && s.r >= 2 && s.last };
function record(id, ok) { const s = stats[id] || { r: 0, w: 0, last: false }; ok ? s.r++ : s.w++; s.last = ok; stats[id] = s; store.set('stats', stats) }
function masteryBar(c) {
  const n = c.pests.length, m = c.pests.filter(isMastered).length;
  if (!Object.keys(stats).length) return '';
  return `<span class="mbar" title="${esc(t('mastered', m, n))}"><span style="width:${n ? m / n * 100 : 0}%"></span></span>`;
}
let learn = { mode: store.get('learnMode', 'quiz'), crop: 'ALL', deck: [], i: 0, score: 0, answered: false, shown: false, opts: [] };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]] } return a };
function buildDeck() {
  const byPest = new Map();
  DATA.pests.forEach(p => {
    if (learn.crop !== 'ALL' && !p.crops.includes(learn.crop)) return;
    const ss = p.symptoms.filter(s => s.img); if (ss.length) byPest.set(p, ss);
  });
  // weighted draw without replacement: missed last time 5, unseen 3, seen 2, mastered 1
  const pool = [...byPest.keys()].map(p => { const s = stats[p.id]; return { p, w: !s ? 3 : !s.last ? 5 : isMastered(p.id) ? 1 : 2 } });
  const deck = [];
  while (deck.length < 10 && pool.length) {
    let r = Math.random() * pool.reduce((a, x) => a + x.w, 0), k = 0;
    while ((r -= pool[k].w) > 0) k++;
    const { p } = pool.splice(k, 1)[0], ss = byPest.get(p);
    deck.push({ p, s: ss[Math.random() * ss.length | 0] });
  }
  learn.deck = deck; learn.i = 0; learn.score = 0; prepQ();
}
function prepQ() {
  const cur = learn.deck[learn.i]; learn.answered = false; learn.shown = false; if (!cur) return;
  if (learn.mode === 'type') {
    const others = shuffle(Object.keys(KINDS).filter(k => k !== cur.p.kind && k !== 'lichen')).slice(0, 3);
    learn.opts = shuffle([cur.p.kind, ...others]); return;
  }
  const same = DATA.pests.filter(p => p !== cur.p && p.crops.some(c => cur.p.crops.includes(c)));
  const extra = shuffle(same).slice(0, 3);
  if (extra.length < 3) extra.push(...shuffle(DATA.pests.filter(p => p !== cur.p && !extra.includes(p))).slice(0, 3 - extra.length));
  learn.opts = shuffle([cur.p, ...extra]);
}
function vLearn() {
  if (!learn.deck.length) buildDeck();
  const n = learn.deck.length, cur = learn.deck[learn.i];
  const scope = learn.crop === 'ALL' ? DATA.pests : DATA.pests.filter(p => p.crops.includes(learn.crop));
  const m = scope.filter(p => isMastered(p.id)).length;
  let h = `<h2>${esc(t('learnTitle'))}</h2>
  <div class="seg three" id="lMode">${['quiz', 'type', 'cards'].map(k => `<button type="button" data-v="${k}" aria-pressed="${learn.mode === k}">${esc(t(k === 'type' ? 'quizType' : k))}</button>`).join('')}</div>
  <div class="prog"><label class="sel"><span class="eyebrow">${esc(t('learnCrop'))}</span><select id="lCrop"><option value="ALL">${esc(t('allCrops'))}</option>${DATA.crops.map(c => `<option value="${c.code}"${learn.crop === c.code ? ' selected' : ''}>${esc(L(c.name))}</option>`).join('')}</select></label>
    <div class="bar"><span class="eyebrow">${esc(t('progress'))}</span><span class="eyebrow">${esc(t('mastered', m, scope.length))}</span></div>
    <div class="progress"><span style="width:${scope.length ? m / scope.length * 100 : 0}%"></span></div></div>`;
  if (!cur) return h + `<div class="card"><p>${esc(t('quizDone', learn.score, n))}</p><button class="primary" type="button" id="lAgain">${esc(t('again'))}</button>
    <p class="lede small">${esc(t('masteredHint'))}</p></div>`;
  h += `<div class="bar qbar"><span class="eyebrow">${learn.i + 1} / ${n}</span>${learn.mode !== 'cards' ? `<span class="eyebrow">${esc(t('score', learn.score, learn.i + (learn.answered ? 1 : 0)))}</span>` : ''}</div>`;
  const pic = bigImg(cur.s.img, 'qimg', '');
  const where = `${cur.p.crops.map(c => esc(L(CROPS.get(c).name))).join(' · ')} · ${esc(L(DATA.parts[cur.s.part]))}`;
  const answerBlock = `<a href="#pest/${cur.p.id}">${esc(t('diagOpen'))} ›</a>`;
  if (learn.mode === 'cards') {
    return h + `<div class="flash">${pic}<div class="a"><span class="qpart">${where}</span>
      ${learn.shown ? `${kindTag(cur.p)}<b>${esc(L(cur.p.name))}</b><span class="sci">${cur.p.sci}</span><div class="rich">${L(cur.s.text)}</div>${answerBlock}`
        : `<p class="lede">${esc(t('cardsHint'))}</p>`}</div></div>
      <button class="primary" type="button" id="${learn.shown ? 'lNext' : 'lShow'}">${esc(learn.shown ? t('next') : t('reveal'))}</button>`;
  }
  const isType = learn.mode === 'type', correct = isType ? cur.p.kind : cur.p;
  const label = o => isType ? esc(t('kind_' + o)) : `${esc(L(o.name))}<span class="sci">${o.sci}</span>`;
  h += `${pic}<span class="qpart">${where}</span><b>${esc(t(isType ? 'quizTypeQ' : 'quizQ'))}</b>
    <div class="answers">${learn.opts.map((o, i) => `<button type="button" data-i="${i}" ${learn.answered ? 'disabled' : ''} class="${learn.answered ? (o === correct ? 'ok' : (learn.pick === i ? 'no' : '')) : ''}">${label(o)}</button>`).join('')}</div>`;
  if (learn.answered) {
    const ok = learn.opts[learn.pick] === correct;
    h += `<div class="card feedback ${ok ? 'good' : 'badc'}" role="status"><b>${ok ? esc(t('right')) : esc(t('wrong')) + ' ' + (isType ? esc(t('kind_' + correct)) : esc(L(cur.p.name)))}</b>
      ${isType ? `<p>${kindTag(cur.p)} ${esc(L(cur.p.name))}</p><p class="small">${esc(L(KINDS[cur.p.kind].sign))}</p>` : `<div class="rich">${L(cur.s.text)}</div>`}${answerBlock}</div>
      <button class="primary" type="button" id="lNext">${esc(t('next'))}</button>`;
  }
  return h;
}

/* ---------- Router ---------- */
let route = [];
function render(keepScroll) {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  document.title = t('appName');
  $('#appName').textContent = t('appName');
  $$('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  $('#langBtn').textContent = { ms: 'BM', en: 'EN', zh: '中' }[lang];
  $$('#onboard [data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#offline').textContent = t('offline');
  $('#ver').textContent = t('version', VERSION);
  const [r, a, b] = route, v = $('#view');
  const tab = r === 'crop' || r === 'pest' || r === 'guide' ? 'crops' : (['crops', 'diag', 'learn', 'search'].includes(r) ? r : 'crops');
  $$('.tabs a').forEach(x => x.dataset.tab === tab ? x.setAttribute('aria-current', 'page') : x.removeAttribute('aria-current'));
  v.innerHTML = r === 'crop' ? vCrop(a) : r === 'pest' ? vPest(a) : r === 'diag' ? vDiag(a, b) : r === 'learn' ? vLearn() : r === 'search' ? vSearch() : r === 'guide' ? (aiOpen = a === 'ai' ? b : null, vGuide(a)) : vCrops();
  if (r === 'search') { renderSearch(); const i = $('#q'); i.addEventListener('input', () => { q = i.value; renderSearch() }); if (!keepScroll) i.focus({ preventScroll: true }) }
  if (!keepScroll) { window.scrollTo(0, 0); v.focus({ preventScroll: true }) }
}
function go() {
  route = location.hash.slice(1).split('/').filter(Boolean);
  render(false);
  if (route[0] === 'guide' && route[1]) setTimeout(() => (route[1] === 'ai' ? $(route[2] ? '#ai-' + decodeURIComponent(route[2]).replace(/\W+/g, '-') : '#ai') : $('#kind-' + route[1]))?.scrollIntoView({ block: 'start' }), 0);
  if (route[0] === 'diag' && route[2]) setTimeout(() => $('#diagRes')?.scrollIntoView({ block: 'start' }), 0);
}
addEventListener('hashchange', go);

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { setLang(lb.dataset.lang); if (lb.closest('#onboard')) { $('#onboard').hidden = true; store.set('picked', true) } return }
  if (e.target.closest('[data-back]')) { history.length > 1 ? history.back() : (location.hash = '#crops'); return }
  const im = e.target.closest('img[data-full]');
  if (im && !e.target.closest('a')) { openViewer(im.dataset.full, im.alt); return }
  const m = e.target.closest('#lMode button'); if (m) { learn.mode = m.dataset.v; store.set('learnMode', learn.mode); buildDeck(); render(true); return }
  const kf = e.target.closest('#kFilter button'); if (kf) { kindFilter = kf.dataset.v; render(true); return }
  if (e.target.closest('#shareBtn')) { sharePest(); return }
  const j = e.target.closest('[data-jump]'); if (j) { document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return }
  if (e.target.closest('#resetBtn')) { stats = {}; store.set('stats', stats); toast(t('resetDone')); return }
  if (e.target.closest('#lShow')) { learn.shown = true; render(true); return }
  if (e.target.closest('#lNext')) { learn.i++; prepQ(); render(true); window.scrollTo(0, 0); return }
  if (e.target.closest('#lAgain')) { buildDeck(); render(true); return }
  const ans = e.target.closest('.answers button');
  if (ans && !learn.answered) {
    const cur = learn.deck[learn.i]; learn.pick = +ans.dataset.i; learn.answered = true;
    const ok = learn.opts[learn.pick] === (learn.mode === 'type' ? cur.p.kind : cur.p);
    if (ok) learn.score++;
    if (learn.mode === 'quiz') record(cur.p.id, ok);
    render(true); $('.feedback')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return
  }
});
async function sharePest() {
  const url = location.href, title = $('.title h2')?.textContent || t('appName');
  try { if (navigator.share) { await navigator.share({ title, url }); return } } catch { return }
  try { await navigator.clipboard.writeText(title + '\n' + url); toast(t('copied')) } catch {}
}
$('#langBtn').onclick = () => setLang({ ms: 'en', en: 'zh', zh: 'ms' }[lang]);
function setLang(l) { lang = l; store.set('lang', l); render(true) }

document.addEventListener('change', e => { if (e.target.id === 'lCrop') { learn.crop = e.target.value; buildDeck(); render(true) } });

/* Settings sheet */
const sheet = $('#setSheet'), viewer = $('#viewer');
function openSheet() { sheet.hidden = false; syncPrefs(); history.pushState({ sheet: 1 }, ''); $('#setTitle').focus({ preventScroll: true }) }
function closeSheet(fromBack) { if (sheet.hidden) return; sheet.hidden = true; if (!fromBack && history.state?.sheet) history.back(); $('#setBtn').focus() }
$('#setBtn').onclick = openSheet;
sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('[data-close]')) closeSheet() });
function syncPrefs() {
  const th = store.get('theme', 'system'), sz = store.get('textSize', 1);
  $$('#setTheme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === th));
  $$('#setSize button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === sz));
}
$('#setTheme').onclick = e => { const b = e.target.closest('button'); if (!b) return; store.set('theme', b.dataset.v);
  if (b.dataset.v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = b.dataset.v; syncPrefs() };
$('#setSize').onclick = e => { const b = e.target.closest('button'); if (!b) return; store.set('textSize', +b.dataset.v); document.documentElement.style.fontSize = [90, 100, 115, 130][+b.dataset.v] + '%'; syncPrefs() };

/* Photo viewer: tap to zoom */
function openViewer(src, cap) {
  const i = $('#vStage img'); i.src = src; i.alt = cap || ''; $('#vCap').textContent = cap ? cap + ' · ' + t('pinch') : t('pinch');
  $('#vStage').classList.remove('zoomed'); viewer.hidden = false; history.pushState({ viewer: 1 }, ''); $('.vx').focus();
}
function closeViewer(fromBack) { if (viewer.hidden) return; viewer.hidden = true; if (!fromBack && history.state?.viewer) history.back() }
viewer.addEventListener('click', e => { if (e.target.closest('[data-close]')) return closeViewer(); if (e.target.tagName === 'IMG') $('#vStage').classList.toggle('zoomed'); else if (e.target === $('#vStage')) closeViewer() });
addEventListener('popstate', () => { closeSheet(true); closeViewer(true) });
addEventListener('keydown', e => { if (e.key === 'Escape') { closeViewer(); closeSheet() } });

/* Offline: download every photo into the cache */
$('#dlBtn').onclick = async () => {
  const files = new Set();
  DATA.pests.forEach(p => p.symptoms.forEach(s => { [s.img, ...s.steps.map(x => x.img)].forEach(f => f && files.add(full(f)) && files.add(thumb(f))) }));
  DATA.crops.forEach(c => c.img && files.add(thumb(c.img)));
  const list = [...files], msg = $('#dlMsg'), btn = $('#dlBtn'); let done = 0, fail = 0;
  msg.hidden = false; btn.disabled = true;
  const cache = await caches.open('croppest-img');
  for (let k = 0; k < list.length; k += 6) {
    await Promise.all(list.slice(k, k + 6).map(async u => { try { if (!(await cache.match(u))) { const r = await fetch(u); if (!r.ok) throw 0; await cache.put(u, r) } } catch { fail++ } done++; msg.textContent = t('offlineProg', done, list.length) }));
  }
  msg.textContent = fail ? t('offlineFail') : t('offlineDone'); btn.disabled = false; store.set('offlineReady', !fail);
};

let tt; function toast(m, ms = 2400) { const e = $('#toast'); e.textContent = m; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, ms) }
function net() { $('#offline').hidden = navigator.onLine } addEventListener('online', net); addEventListener('offline', net); net();

if (!store.get('picked', false)) $('#onboard').hidden = false;
go();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  if (store.get('ver', VERSION) !== VERSION) setTimeout(() => toast(t('updated')), 600);
  store.set('ver', VERSION);
}
</script>
