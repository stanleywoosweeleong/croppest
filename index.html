<style>
/* Phone-first app shell: frosted top bar, one view per route, bottom tab bar.
   Interface text comes from i18n.js, pest content from data.js. */
:root{
  --bg:#f2eee5; --surface:#fbf8f1; --ink:#2b2822; --muted:#615b50; --line:#ddd5c6;
  --accent:#2a7149; --accent-soft:#dcefe2; --bad:#a3392f; --bad-soft:#f6dfdb;
  --warn:#8a5e08; --warn-soft:#f6ead0; --bar:#24432f; --bar-ink:#eef5ef;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar:64px; --topbar:56px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a15; --surface:#1a241e; --ink:#dcd6c8; --muted:#a29c8f; --line:#2e3c34;
  --accent:#72c693; --accent-soft:#1f3628; --bad:#ef8f84; --bad-soft:#3d2320;
  --warn:#e2b14e; --warn-soft:#3a2f17; --bar:#2f5a3e; --bar-ink:#eef5ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a15; --surface:#1a241e; --ink:#dcd6c8; --muted:#a29c8f; --line:#2e3c34;
  --accent:#72c693; --accent-soft:#1f3628; --bad:#ef8f84; --bad-soft:#3d2320;
  --warn:#e2b14e; --warn-soft:#3a2f17; --bar:#2f5a3e; --bar-ink:#eef5ef; color-scheme:dark}
:lang(zh){--f-display:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
:lang(zh) body{font-size:1.1rem;font-weight:500;line-height:1.7}
:lang(zh) h1,:lang(zh) h2,:lang(zh) h3{font-weight:700}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.03rem;line-height:1.55;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;min-height:100vh}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

.top{position:fixed;inset:0 0 auto;z-index:20;
  background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(20px);backdrop-filter:saturate(1.4) blur(20px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{height:var(--topbar);display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.top h1{font-size:1.25rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offline-tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer;white-space:nowrap;font-weight:700}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.langsw button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted);min-width:38px}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg,.tabs svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn svg{width:18px;height:18px}

main{padding-top:calc(var(--topbar) + env(safe-area-inset-top,0px));
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:760px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:16px}
.view > h2{font-size:1.6rem}
.lede{color:var(--muted)}
.eyebrow{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.backbtn{align-self:flex-start;border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;display:inline-flex;gap:4px;align-items:center}

/* Crop grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.crop{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crop .ph{display:block;aspect-ratio:4/3;background:#fff}
.crop .ph img{width:100%;height:100%;object-fit:cover;display:block}
.crop .t{flex:1}
.crop .t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.crop .t b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.crop .t small{color:var(--muted);font-size:.85rem}
:lang(zh) .crop .t b{font-weight:700}

/* Pest list rows */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) 12px;gap:12px;align-items:center;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.row img,.row .noimg{width:76px;height:76px;object-fit:cover;border-radius:8px;display:block;background:#fff}
.row .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t b{font-weight:700;line-height:1.3}
.sci{color:var(--muted);font-size:.9rem;display:block}
.row .t small{color:var(--muted);font-size:.82rem}
.row .chev{color:var(--muted)}
.kind{display:inline-block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;border-radius:999px;padding:1px 8px;align-self:flex-start}

/* Pest detail */
.hero{border-radius:14px;overflow:hidden;background:#fff;cursor:zoom-in}
.hero img{width:100%;max-height:440px;object-fit:contain;display:block}
.title h2{font-size:1.5rem}
.title .alt{color:var(--muted);font-size:.95rem;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;text-decoration:none;color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:1.2rem}
.rich > * + *{margin-top:10px}
.rich ul,.rich ol{margin:0;padding-left:1.25em}
.rich li + li{margin-top:6px}
.sym{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.sym:first-of-type{border-top:0;padding-top:0}
.sym .part{font-weight:700;color:var(--accent)}
.sym img{width:100%;max-height:420px;object-fit:contain;background:#fff;border-radius:10px;display:block;background:var(--line);cursor:zoom-in}
details.steps{background:var(--bg);border-radius:10px;padding:10px 12px}
details.steps summary{cursor:pointer;font-weight:700;color:var(--accent)}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;margin-top:10px;align-items:start}
.step img{width:96px;height:96px;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--line)}
.step .n{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.step.noimg{grid-template-columns:1fr}
.src{font-size:.9rem;color:var(--muted)}
.note{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}

/* Diagnose */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700;text-decoration:none;color:inherit}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.match{display:flex;flex-direction:column;gap:10px}
.match img{width:100%;max-height:360px;object-fit:contain;background:#fff;border-radius:10px;display:block;background:var(--line);cursor:zoom-in}
.match .name{font-weight:700;font-size:1.05rem}

/* Search */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
mark{background:var(--warn-soft);color:inherit;border-radius:3px}

/* Learn */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg.three{grid-template-columns:repeat(3,1fr)} .seg.four{grid-template-columns:repeat(4,1fr)}
.seg button{border:0;border-radius:9px;padding:10px 6px;background:transparent;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.qimg{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:12px;display:block;background:var(--line);cursor:zoom-in}
.qpart{color:var(--muted);font-size:.9rem}
.answers{display:flex;flex-direction:column;gap:8px}
.answers button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700}
.answers button.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.answers button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.answers button:disabled{cursor:default}
.answers button .sci{font-weight:400;font-size:.88rem}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.flash .qimg{border-radius:0}
.flash .a{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.primary{border:0;background:var(--bar);color:var(--bar-ink);border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;font-size:1rem;text-align:center;text-decoration:none}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Tabs */
.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{height:var(--tabbar);display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:700}
.tabs svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--accent)}

/* Sheets, viewer, onboarding */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{font-size:1.3rem}
.xbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--line);font-size:1.4rem;line-height:1;cursor:pointer}
.blk{display:flex;flex-direction:column;gap:8px}
.blk > b{font-size:.95rem}
.blk p{color:var(--muted);font-size:.93rem}
.ver{text-align:center;color:var(--muted);font-size:.85rem}
html:has(.scrim:not([hidden])),html:has(.viewer:not([hidden])),html:has(.onboard:not([hidden])){overflow:hidden}
.viewer{position:fixed;inset:0;z-index:70;background:rgb(10 14 11 / .95);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer .vb{display:flex;justify-content:flex-end;padding:8px}
.viewer .vx{width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255 / .16);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer}
.viewer .vs{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
.viewer .vs img{max-width:100%;max-height:100%;border-radius:8px;cursor:zoom-in}
.viewer .vs.zoomed{align-items:flex-start;justify-content:flex-start}
.viewer .vs.zoomed img{max-width:none;max-height:none;width:250%;flex:none;cursor:zoom-out}
.viewer .vc{color:#e8eee9;font-size:.9rem;padding:8px 16px 12px;text-align:center}
.onboard{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.ob-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;text-align:center}
.ob-in img{width:72px;height:72px;border-radius:16px;align-self:center}
.ob-in h2{font-size:1.3rem;line-height:1.5}
.langs{display:flex;flex-direction:column;gap:10px}
.langs button{display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;font-size:1.1rem;font-weight:700}
.langs button span{font-weight:400;color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top">
  <div class="top-in">

      <button type="button" data-lang="en">English <span>EN</span></button>
      <button type="button" data-lang="zh">中文 <span>华语</span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
const VERSION = '1.0.0';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('cp.' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('cp.' + k, JSON.stringify(v)) } catch {} }
};
const guessLang = () => { const n = (navigator.language || 'ms').toLowerCase(); return n.startsWith('zh') ? 'zh' : n.startsWith('en') ? 'en' : 'ms' };
let lang = store.get('lang', null) || guessLang();
const t = (k, ...a) => { const v = UI[lang][k]; return typeof v === 'function' ? v(...a) : v };
const L = o => o ? (o[lang] || o.ms || o.en || '') : '';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim() };

const PESTS = new Map(DATA.pests.map(p => [p.id, p]));
const CROPS = new Map(DATA.crops.map(c => [c.code, c]));
const PART_ORDER = ['LEAF', 'STEM', 'FR', 'FLOWER', 'ROOT', 'PLANT', 'PEST', 'MORFOLOGI'];
const thumb = f => f ? 'img/t/' + f : '';
const full = f => f ? 'img/' + f : '';
const firstImg = p => { for (const s of p.symptoms) { if (s.img) return s.img; for (const st of s.steps) if (st.img) return st.img } return null };
const sourceUrl = p => 'https://smarttani.sabah.gov.my/ALUS/Pest/library/pest/detail/' + p.id + '/view/';
const img = (f, cls = '', alt = '') => f ? `<img src="${thumb(f)}" data-full="${full(f)}" class="${cls}" alt="${esc(alt)}" loading="lazy" decoding="async">` : '';
const bigImg = (f, cls = '', alt = '') => f ? `<img src="${full(f)}" data-full="${full(f)}" class="${cls}" alt="${esc(alt)}" loading="lazy" decoding="async">` : '';

/* ---------- Views ---------- */
function pestRow(p, extra = '') {
  const f = firstImg(p);
  return `<a class="row" href="#pest/${p.id}">${f ? img(f, '', '') : '<span class="noimg"></span>'}
    <span class="t"><b>${esc(L(p.name))}</b><span class="sci">${p.sci}</span>${extra}</span><span class="chev">›</span></a>`;
}
function vCrops() {
  return `<p class="eyebrow">${esc(t('appSub'))}</p><h2>${esc(t('cropsTitle'))}</h2><p class="lede">${esc(t('cropsLede'))}</p>
  <div class="grid">${DATA.crops.map(c => `<a class="crop" href="#crop/${c.code}"><span class="ph">${c.img ? `<img src="${thumb(c.img)}" alt="" loading="lazy">` : ''}</span>
    <span class="t"><b>${esc(L(c.name))}</b><small>${esc(t('nPests', c.pests.length))}</small></span></a>`).join('')}</div>`;
}
function vCrop(code) {
  const c = CROPS.get(code); if (!c) return vCrops();
  const ps = c.pests.map(id => PESTS.get(id)).filter(Boolean).sort((a, b) => L(a.name).localeCompare(L(b.name), lang));
  return `<button class="backbtn" type="button" data-back>‹ ${esc(t('back'))}</button>
  <h2>${esc(L(c.name))}</h2><p class="lede">${esc(t('nPests', ps.length))}</p>
  <div class="list">${ps.map(p => pestRow(p)).join('')}</div>`;
}
function vPest(id) {
  const p = PESTS.get(+id); if (!p) return vCrops();
  const hero = firstImg(p);
  const syms = p.symptoms.slice().sort((a, b) => PART_ORDER.indexOf(a.part) - PART_ORDER.indexOf(b.part));
  return `<button class="backbtn" type="button" data-back>‹ ${esc(t('back'))}</button>
  ${hero ? `<div class="hero">${bigImg(hero, '', L(p.name))}</div>` : ''}
  <div class="title"><h2>${esc(L(p.name))}</h2><p class="alt sci">${p.sci}</p>
    <p class="alt">${['ms', 'en', 'zh'].filter(l => l !== lang).map(l => esc(p.name[l] || '')).filter(Boolean).join(' · ')}</p></div>
  <div class="blk"><span class="eyebrow">${esc(t('affected'))}</span><div class="chips">${p.crops.map(c => `<a class="chip" href="#crop/${c}">${esc(L(CROPS.get(c).name))}</a>`).join('')}</div></div>
  ${L(p.desc) ? `<div class="card"><h3>${esc(t('about'))}</h3><div class="rich">${L(p.desc)}</div></div>` : ''}
  ${syms.length ? `<div class="card"><h3>${esc(t('symptoms'))}</h3>${syms.map(s => `<div class="sym">
    <span class="part">${esc(L(DATA.parts[s.part]))}</span>
    ${s.img ? bigImg(s.img, '', L(DATA.parts[s.part])) : ''}
    <div class="rich">${L(s.text)}</div>
    ${s.steps.some(st => L(st.text) || st.img) ? `<details class="steps"><summary>${esc(t('steps'))}</summary>${s.steps.map((st, i) => `<div class="step${st.img ? '' : ' noimg'}">${img(st.img)}<div><div class="n">${esc(t('stepN', i + 1))}</div><div class="rich">${L(st.text)}</div></div></div>`).join('')}</details>` : ''}
  </div>`).join('')}</div>` : ''}
  <p class="src">${esc(t('source'))}: <a href="${sourceUrl(p)}" target="_blank" rel="noopener">smarttani.sabah.gov.my</a></p>`;
}

/* Diagnose: crop -> part -> matching symptoms */
function partsFor(code) {
  const set = new Set();
  CROPS.get(code).pests.forEach(id => (PESTS.get(id)?.symptoms || []).forEach(s => set.add(s.part)));
  return PART_ORDER.filter(p => set.has(p)).concat([...set].filter(p => !PART_ORDER.includes(p)));
}
function vDiag(code, part) {
  const c = code && CROPS.get(code);
  let h = `<h2>${esc(t('diagTitle'))}</h2><p class="lede">${esc(t('diagLede'))}</p>
  <div class="blk"><b>${esc(t('diagCrop'))}</b><div class="opts">${DATA.crops.map(x => `<a class="opt" href="#diag/${x.code}" aria-pressed="${x.code === code}">${esc(L(x.name))}</a>`).join('')}</div></div>`;
  if (c) {
    const parts = partsFor(code);
    h += `<div class="blk"><b>${esc(t('diagPart'))}</b><div class="opts">${parts.map(p => `<a class="opt" href="#diag/${code}/${p}" aria-pressed="${p === part}">${esc(L(DATA.parts[p]))}</a>`).join('')}</div></div>`;
    if (part) {
      const hits = [];
      c.pests.forEach(id => { const p = PESTS.get(id); p && p.symptoms.filter(s => s.part === part).forEach(s => hits.push([p, s])) });
      h += `<p class="eyebrow" id="diagRes">${esc(t('diagMatch', hits.length))}</p>
      ${hits.map(([p, s]) => `<div class="card match">${s.img ? bigImg(s.img, '', L(p.name)) : ''}
        <div class="rich">${L(s.text)}</div>
        <div><div class="name">${esc(L(p.name))}</div><span class="sci">${p.sci}</span></div>
        <a class="primary" href="#pest/${p.id}">${esc(t('diagOpen'))}</a></div>`).join('')}
      <p class="note">${esc(t('diagNote'))}</p>`;
    }
  }
  return h;
}

/* Search across all three languages */
let q = '';
function searchHits(s) {
  s = s.trim().toLowerCase(); if (s.length < 2) return null;
  return DATA.pests.filter(p => (p._idx ||= [p.name.ms, p.name.en, p.name.zh, plain(p.sci),
    ...p.crops.flatMap(c => Object.values(CROPS.get(c).name)),
    ...['ms', 'en', 'zh'].flatMap(l => [plain(p.desc[l] || ''), ...p.symptoms.map(x => plain(x.text[l] || ''))])].join(' ').toLowerCase()).includes(s));
}
function vSearch() {
  return `<h2>${esc(t('tabSearch'))}</h2><input class="search" id="q" type="search" autocomplete="off" placeholder="${esc(t('searchPh'))}" value="${esc(q)}"><div class="list" id="qres"></div>`;
}
function renderSearch() {
  const hits = searchHits(q), el = $('#qres'); if (!el) return;
  el.innerHTML = hits == null ? `<p class="lede">${esc(t('searchHint'))}</p>` : hits.length ? hits.map(p => pestRow(p, `<small>${p.crops.map(c => esc(L(CROPS.get(c).name))).join(' · ')}</small>`)).join('') : `<p class="lede">${esc(t('searchNone'))}</p>`;
}

/* Learn: flashcards and quiz built from every symptom photo */
let learn = { mode: store.get('learnMode', 'quiz'), crop: 'ALL', deck: [], i: 0, score: 0, answered: false, shown: false, opts: [] };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]] } return a };
function buildDeck() {
  const cards = [];
  DATA.pests.forEach(p => {
    if (learn.crop !== 'ALL' && !p.crops.includes(learn.crop)) return;
    p.symptoms.forEach(s => { if (s.img) cards.push({ p, s }) });
  });
  learn.deck = shuffle(cards).slice(0, 10); learn.i = 0; learn.score = 0; learn.answered = false; learn.shown = false; prepQ();
}
function prepQ() {
  const cur = learn.deck[learn.i]; if (!cur) return;
  const pool = DATA.pests.filter(p => p !== cur.p && (learn.crop === 'ALL' ? p.crops.some(c => cur.p.crops.includes(c)) : p.crops.includes(learn.crop)));
  const extra = shuffle(pool.length >= 3 ? pool : DATA.pests.filter(p => p !== cur.p)).slice(0, 3);
  learn.opts = shuffle([cur.p, ...extra]); learn.answered = false; learn.shown = false;
}
function vLearn() {
  if (!learn.deck.length) buildDeck();
  const n = learn.deck.length, cur = learn.deck[learn.i];
  let h = `<h2>${esc(t('learnTitle'))}</h2><p class="lede">${esc(t('learnLede'))}</p>
  <div class="seg" id="lMode"><button type="button" data-v="quiz" aria-pressed="${learn.mode === 'quiz'}">${esc(t('quiz'))}</button><button type="button" data-v="cards" aria-pressed="${learn.mode === 'cards'}">${esc(t('cards'))}</button></div>
  <div class="opts" id="lCrop"><button class="opt" type="button" data-v="ALL" aria-pressed="${learn.crop === 'ALL'}">${esc(t('allCrops'))}</button>${DATA.crops.map(c => `<button class="opt" type="button" data-v="${c.code}" aria-pressed="${learn.crop === c.code}">${esc(L(c.name))}</button>`).join('')}</div>`;
  if (!cur) return h + `<div class="card"><p>${esc(t('quizDone', learn.score, n))}</p><button class="primary" type="button" id="lAgain">${esc(t('again'))}</button></div>`;
  h += `<div class="bar"><span class="eyebrow">${learn.i + 1} / ${n}</span>${learn.mode === 'quiz' ? `<span class="eyebrow">${esc(t('score', learn.score, learn.i + (learn.answered ? 1 : 0)))}</span>` : ''}</div>
  <div class="progress"><span style="width:${(learn.i / n) * 100}%"></span></div>`;
  const pic = bigImg(cur.s.img, 'qimg', '');
  const crops = cur.p.crops.map(c => L(CROPS.get(c).name)).join(' · ');
  if (learn.mode === 'cards') {
    h += `<div class="flash">${pic}<div class="a"><span class="qpart">${esc(crops)} · ${esc(L(DATA.parts[cur.s.part]))}</span>
      ${learn.shown ? `<b>${esc(L(cur.p.name))}</b><span class="sci">${cur.p.sci}</span><div class="rich">${L(cur.s.text)}</div><a href="#pest/${cur.p.id}">${esc(t('diagOpen'))}</a>`
        : `<p class="lede">${esc(t('cardsHint'))}</p>`}</div></div>
      <button class="primary" type="button" id="${learn.shown ? 'lNext' : 'lShow'}">${esc(learn.shown ? t('next') : t('reveal'))}</button>`;
  } else {
    h += `${pic}<span class="qpart">${esc(crops)} · ${esc(L(DATA.parts[cur.s.part]))}</span><b>${esc(t('quizQ'))}</b>
      <div class="answers">${learn.opts.map((p, i) => `<button type="button" data-i="${i}" ${learn.answered ? 'disabled' : ''} class="${learn.answered ? (p === cur.p ? 'ok' : (learn.pick === i ? 'no' : '')) : ''}">${esc(L(p.name))}<span class="sci">${p.sci}</span></button>`).join('')}</div>
      ${learn.answered ? `<p role="status"><b>${learn.opts[learn.pick] === cur.p ? esc(t('right')) : esc(t('wrong')) + ' ' + esc(L(cur.p.name))}</b></p>
        <div class="rich">${L(cur.s.text)}</div>
        <button class="primary" type="button" id="lNext">${esc(t('next'))}</button>` : ''}`;
  }
  return h;
}

/* ---------- Router ---------- */
let route = [];
function render(keepScroll) {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  document.title = t('appName');
  $('#appName').textContent = t('appName');
  $$('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  $$('.langsw button, #setLang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#offline').textContent = t('offline');
  $('#ver').textContent = t('version', VERSION);
  const [r, a, b] = route, v = $('#view');
  const tab = r === 'crop' || r === 'pest' ? 'crops' : (['crops', 'diag', 'learn', 'search'].includes(r) ? r : 'crops');
  $$('.tabs a').forEach(x => x.dataset.tab === tab ? x.setAttribute('aria-current', 'page') : x.removeAttribute('aria-current'));
  v.innerHTML = r === 'crop' ? vCrop(a) : r === 'pest' ? vPest(a) : r === 'diag' ? vDiag(a, b) : r === 'learn' ? vLearn() : r === 'search' ? vSearch() : vCrops();
  if (r === 'search') { renderSearch(); const i = $('#q'); i.addEventListener('input', () => { q = i.value; renderSearch() }); if (!keepScroll) i.focus({ preventScroll: true }) }
  if (!keepScroll) { window.scrollTo(0, 0); v.focus({ preventScroll: true }) }
}
function go() {
  route = location.hash.slice(1).split('/').filter(Boolean);
  render(false);
  if (route[0] === 'diag' && route[2]) setTimeout(() => $('#diagRes')?.scrollIntoView({ block: 'start' }), 0);
}
addEventListener('hashchange', go);

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { setLang(lb.dataset.lang); if (lb.closest('#onboard')) { $('#onboard').hidden = true; store.set('picked', true) } return }
  if (e.target.closest('[data-back]')) { history.length > 1 ? history.back() : (location.hash = '#crops'); return }
  const im = e.target.closest('img[data-full]');
  if (im && !e.target.closest('a')) { openViewer(im.dataset.full, im.alt); return }
  const m = e.target.closest('#lMode button'); if (m) { learn.mode = m.dataset.v; store.set('learnMode', learn.mode); buildDeck(); render(true); return }
  const c = e.target.closest('#lCrop button'); if (c) { learn.crop = c.dataset.v; buildDeck(); render(true); return }
  if (e.target.closest('#lShow')) { learn.shown = true; render(true); return }
  if (e.target.closest('#lNext')) { learn.i++; prepQ(); render(true); window.scrollTo(0, 0); return }
  if (e.target.closest('#lAgain')) { buildDeck(); render(true); return }
  const ans = e.target.closest('.answers button');
  if (ans && !learn.answered) { learn.pick = +ans.dataset.i; learn.answered = true; if (learn.opts[learn.pick] === learn.deck[learn.i].p) learn.score++; render(true); return }
});
function setLang(l) { lang = l; store.set('lang', l); render(true) }

/* Settings sheet */
const sheet = $('#setSheet'), viewer = $('#viewer');
function openSheet() { sheet.hidden = false; syncPrefs(); history.pushState({ sheet: 1 }, ''); $('#setTitle').focus({ preventScroll: true }) }
function closeSheet(fromBack) { if (sheet.hidden) return; sheet.hidden = true; if (!fromBack && history.state?.sheet) history.back(); $('#setBtn').focus() }
$('#setBtn').onclick = openSheet;
sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('[data-close]')) closeSheet() });
function syncPrefs() {
  const th = store.get('theme', 'system'), sz = store.get('textSize', 1);
  $$('#setTheme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === th));
  $$('#setSize button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === sz));
}
$('#setTheme').onclick = e => { const b = e.target.closest('button'); if (!b) return; store.set('theme', b.dataset.v);
  if (b.dataset.v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = b.dataset.v; syncPrefs() };
$('#setSize').onclick = e => { const b = e.target.closest('button'); if (!b) return; store.set('textSize', +b.dataset.v); document.documentElement.style.fontSize = [90, 100, 115, 130][+b.dataset.v] + '%'; syncPrefs() };

/* Photo viewer: tap to zoom */
function openViewer(src, cap) {
  const i = $('#vStage img'); i.src = src; i.alt = cap || ''; $('#vCap').textContent = cap ? cap + ' · ' + t('pinch') : t('pinch');
  $('#vStage').classList.remove('zoomed'); viewer.hidden = false; history.pushState({ viewer: 1 }, ''); $('.vx').focus();
}
function closeViewer(fromBack) { if (viewer.hidden) return; viewer.hidden = true; if (!fromBack && history.state?.viewer) history.back() }
viewer.addEventListener('click', e => { if (e.target.closest('[data-close]')) return closeViewer(); if (e.target.tagName === 'IMG') $('#vStage').classList.toggle('zoomed'); else if (e.target === $('#vStage')) closeViewer() });
addEventListener('popstate', () => { closeSheet(true); closeViewer(true) });
addEventListener('keydown', e => { if (e.key === 'Escape') { closeViewer(); closeSheet() } });

/* Offline: download every photo into the cache */
$('#dlBtn').onclick = async () => {
  const files = new Set();
  DATA.pests.forEach(p => p.symptoms.forEach(s => { [s.img, ...s.steps.map(x => x.img)].forEach(f => f && files.add(full(f)) && files.add(thumb(f))) }));
  DATA.crops.forEach(c => c.img && files.add(thumb(c.img)));
  const list = [...files], msg = $('#dlMsg'), btn = $('#dlBtn'); let done = 0, fail = 0;
  msg.hidden = false; btn.disabled = true;
  const cache = await caches.open('croppest-img');
  for (let k = 0; k < list.length; k += 6) {
    await Promise.all(list.slice(k, k + 6).map(async u => { try { if (!(await cache.match(u))) { const r = await fetch(u); if (!r.ok) throw 0; await cache.put(u, r) } } catch { fail++ } done++; msg.textContent = t('offlineProg', done, list.length) }));
  }
  msg.textContent = fail ? t('offlineFail') : t('offlineDone'); btn.disabled = false; store.set('offlineReady', !fail);
};

let tt; function toast(m, ms = 2400) { const e = $('#toast'); e.textContent = m; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, ms) }
function net() { $('#offline').hidden = navigator.onLine } addEventListener('online', net); addEventListener('offline', net); net();

if (!store.get('picked', false)) $('#onboard').hidden = false;
go();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  if (store.get('ver', VERSION) !== VERSION) setTimeout(() => toast(t('updated')), 600);
  store.set('ver', VERSION);
}
</script>
</body>
